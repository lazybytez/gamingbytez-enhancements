name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: 'maven'

      - name: Extract versions from pom.xml
        id: extract_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          MINECRAFT_VERSION=$(mvn help:evaluate -Dexpression=minecraft.version -q -DforceStdout)
          JAVA_VERSION=$(mvn help:evaluate -Dexpression=maven.compiler.release -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "MINECRAFT_VERSION=$MINECRAFT_VERSION" >> $GITHUB_OUTPUT
          echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION for Minecraft $MINECRAFT_VERSION on Java $JAVA_VERSION"

      - name: Build with Maven
        run: mvn --batch-mode clean package

      - name: Create release and upload artifact
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.extract_version.outputs.VERSION }} for Minecraft ${{ steps.extract_version.outputs.MINECRAFT_VERSION }}
          body: |
            Requires a PaperMC server running Minecraft ${{ steps.extract_version.outputs.MINECRAFT_VERSION }} on Java ${{ steps.extract_version.outputs.JAVA_VERSION }}.

            The plugin warns in the console and keeps running on any other Minecraft version.
          files: target/gamingbytez-enhancements-${{ steps.extract_version.outputs.VERSION }}.jar
          generate_release_notes: true
          make_latest: true
